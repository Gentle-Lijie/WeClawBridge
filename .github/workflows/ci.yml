name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build & typecheck (${{ matrix.os }} / node-${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # postinstall is skipped in CI via the env guard, but add a belt-and-braces flag too.
        env:
          CI: "true"
          WECLAW_SKIP_POSTINSTALL: "1"
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test — CLI help
        run: node bin/weclaw.mjs help

      - name: Smoke test — CLI status (no account yet)
        run: node bin/weclaw.mjs status

      - name: Upload build artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to npm (trusted publishing / OIDC)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing uses GitHub OIDC — NO npm token / secret required.
    # Requires a one-time trusted-publisher registration on npmjs.com
    # (package → Settings → Publishing access → Trusted publisher):
    #   repository: Gentle-Lijie/WeClawBridge
    #   workflow:   .github/workflows/ci.yml
    #   environment: (leave empty)
    permissions:
      contents: read
      id-token: write   # OIDC — mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm CLI >= 11.5.1 (Node 24 bundles 11.x;
      # this guarantees a recent enough npm even if the runner lags).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        env:
          WECLAW_SKIP_POSTINSTALL: "1"
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Publish (OIDC trusted publishing, no token)
        run: npm publish --provenance --access public
